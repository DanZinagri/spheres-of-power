# Pagefind full-text search index, built from the Quartz output:
#   npx quartz build && npx pagefind
site: public
# Index only the page itself, not the sidebars, footer, or folder listings
exclude_selectors:
  - ".sidebar"
  - "footer"
  - ".breadcrumb-container"
  - ".content-meta"
  - ".page-listing"
  - ".popover"
  # the pre-Ultimate "Original" versions stay on the page (in their tab) but out of search
  - '.sop-tab[data-tab="original"]'
  # monster stat blocks stay on the site but out of search:
  # their creatures, and the bestiary entries split onto subpages (SPLIT_SECTIONS in scrape.py)
  # any page with `nosearch: true` in its frontmatter (e.g. the sample characters)
  - 'body[data-nosearch]'
  - 'body[data-slug^="Spheres-Of-Might/Practitioner-Bestiary/Bestiary/"]'
  - 'body[data-slug^="Spheres-Of-Power/Sphere-Bestiary/New-Monsters/"]'
  # folder listing pages (e.g. Spheres-Of-Power/Dark/index): just a list of the folder's pages
  - 'body[data-slug$="/index"]'
